<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados · Simulacros Claude</title><style>
:root{color-scheme:light dark;--bg:#f6f5f1;--surface:#fff;--text:#1f1e1c;--muted:#6b6862;--border:#dedad2;--accent:#c96442;--ok:#2f7d4f;--warn:#8a6100}
@media(prefers-color-scheme:dark){:root{--bg:#1a1917;--surface:#242320;--text:#ecebe7;--muted:#a19d95;--border:#3a3834;--accent:#e08a67;--ok:#6cc08b;--warn:#e6c066}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 16px 60px}h1{margin:0 0 4px}p{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin:16px 0}input,select,button{font:inherit;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row input[type=password]{min-width:min(360px,100%)}.tools{justify-content:space-between}.muted{color:var(--muted)}.error{color:#b3372c}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:.82rem;color:var(--muted)}.progress{min-width:110px}.bar{height:6px;background:var(--border);border-radius:9px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.completed{color:var(--ok)}.stale{color:var(--warn)}.hidden{display:none}
</style></head><body><main class="wrap"><h1>Resultados de simulacros Claude</h1><p>Panel privado de avances y evaluaciones del equipo.</p>
<section class="card"><div class="row"><label for="token">Clave de administración</label><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><button class="primary" id="load">Cargar resultados</button><span id="status" class="muted" role="status"></span></div></section>
<section id="results" class="card hidden"><div class="row tools"><div class="row"><input id="search" type="search" placeholder="Buscar participante o correo"><select id="exam"><option value="">Todos los exámenes</option><option>CCAO-F</option><option>CCDV-F</option><option>CCAR-F</option><option>CCAR-P</option></select><select id="state"><option value="">Todos los estados</option><option value="in_progress">En curso</option><option value="completed">Finalizados</option><option value="stale">Sin actividad</option></select></div><button id="csv">Descargar CSV</button></div><p id="count" class="muted"></p><div class="table-wrap"><table><thead><tr><th>Participante</th><th>Examen</th><th>Estado</th><th>Avance</th><th>Resultado</th><th>Tiempo</th><th>Inicio</th><th>Última actividad</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
(()=>{"use strict";const $=id=>document.getElementById(id);let all=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=s=>s?new Date(s).toLocaleString("es-CL"):"—";
const duration=s=>{s=Number(s)||0;return Math.floor(s/60)+" min "+(s%60)+" s"};
function filtered(){const q=$("search").value.trim().toLocaleLowerCase(), exam=$("exam").value, status=$("state").value;return all.filter(a=>{const stale=a.status==="in_progress"&&Date.now()-Date.parse(a.updated_at)>4*60*60*1000;return(!q||(a.participant_name+" "+a.email).toLocaleLowerCase().includes(q))&&(!exam||a.exam_code===exam)&&(!status||a.status===status||(status==="stale"&&stale))})}
function draw(){const list=filtered();$("count").textContent=list.length+" de "+all.length+" intentos";$("rows").innerHTML=list.map(a=>{const stale=a.status==="in_progress"&&Date.now()-Date.parse(a.updated_at)>4*60*60*1000,p=Math.round(100*a.answered_count/a.question_count);return `<tr><td>${esc(a.participant_name)}<br><span class="muted">${esc(a.email)}</span></td><td>${esc(a.exam_code)}</td><td class="${a.status==="completed"?"completed":stale?"stale":""}">${a.status==="completed"?"Finalizado":stale?"Sin actividad":"En curso"}</td><td class="progress">${a.answered_count}/${a.question_count} (${p}%)<div class="bar"><i style="width:${p}%"></i></div></td><td>${a.status==="completed"?`${esc(a.correct_count)}/${esc(a.question_count)} · ${esc(a.score_percent)}%<br>${esc(a.result_label)}`:"—"}</td><td>${duration(a.elapsed_seconds)}</td><td>${date(a.started_at)}</td><td>${date(a.updated_at)}</td></tr>`}).join("")}
async function load(){const token=$("token").value.trim();if(!token){$("status").textContent="Ingresa la clave configurada en Cloudflare.";return}sessionStorage.setItem("examAdminToken",token);$("status").textContent="Cargando…";try{const r=await fetch("/api/admin/attempts",{headers:{Authorization:"Bearer "+token},cache:"no-store"}),data=await r.json();if(!r.ok)throw Error(data.error||"Error "+r.status);all=data.attempts||[];$("results").classList.remove("hidden");$("status").textContent="Datos actualizados.";draw()}catch(e){$("status").textContent=e.message;$("status").className="error"}}
function csv(){const list=filtered(),cols=["participante","correo","examen","estado","respondidas","preguntas","aciertos","porcentaje","resultado","segundos","inicio","actualizado"];const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const rows=list.map(a=>[a.participant_name,a.email,a.exam_code,a.status,a.answered_count,a.question_count,a.correct_count,a.score_percent,a.result_label,a.elapsed_seconds,a.started_at,a.updated_at].map(cell).join(","));const blob=new Blob(["\ufeff"+[cols.map(cell).join(","),...rows].join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="resultados-simulacros.csv";link.click();URL.revokeObjectURL(url)}
$("token").value=sessionStorage.getItem("examAdminToken")||"";$("load").addEventListener("click",load);$("csv").addEventListener("click",csv);["search","exam","state"].forEach(id=>$(id).addEventListener("input",draw));if($("token").value)load();
})();
</script></body></html>
